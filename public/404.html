<!doctype html>
<html lang="ja">

    <meta charset="UTF-8" />

    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>アクセス解析</title>
    <meta property="og:type" content="website" />
    <meta property="og:title" content="アクセス解析" />
    <meta property="og:description" content="freddiefujiwara.com のアクセス解析（GA4）" />
    <meta property="og:url" content="https://freddiefujiwara.com/social/" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="アクセス解析" />
    <meta name="twitter:description" content="freddiefujiwara.com のアクセス解析（GA4）" />
    <link rel="icon"
  href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23000'/%3E%3Ctext x='32' y='42' font-size='34' text-anchor='middle' fill='white' font-family='system-ui'%3EF%3C/text%3E%3C/svg%3E">
    <script>
      // GitHub Pages SPA fallback.
      // Keep /social and pass the requested path to index.html via query string.
      // On the staging site the path is /social/staging/<tab>: keep two
      // segments there, so the redirect lands on the staging index.html
      // rather than the production one.
      const { pathname, search, hash, protocol, hostname, port } = window.location;
      const pathSegmentsToKeep = pathname.split("/")[2] === "staging" ? 2 : 1;
      const redirectPath = pathname
        .split("/")
        .slice(1 + pathSegmentsToKeep)
        .map((segment) => segment.replace(/~/g, "~0").replace(/\./g, "~1"))
        .join("/");

      const keptPath = pathname.split("/").slice(0, 1 + pathSegmentsToKeep).join("/");
      const query = search ? `&${search.slice(1).replace(/&/g, "~and~")}` : "";
      const redirectUrl = `${protocol}//${hostname}${port ? `:${port}` : ""}${keptPath}/?/${redirectPath}${query}${hash}`;
      window.location.replace(redirectUrl);
    </script>
  </head>
  <body></body>
</html>
